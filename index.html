<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>轨道作业车保养 · 十一大类确认单</title>
    <!-- 字体图标与截图库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f4f6fb;
            padding: 18px 14px 50px;
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .page {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border-radius: 30px;
            padding: 16px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            border: 1px solid #eceaeef1;
        }
        .nav-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #1a1f2e;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .date-badge {
            background: #eaeffe;
            color: #2054e0;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 20px 16px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.02);
            border: 1px solid #e9ecf2;
        }
        .card-title {
            font-weight: 600;
            font-size: 16px;
            color: #131e35;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e9eef5;
        }
        .card-title i {
            color: #285fe0;
        }
        .train-id-area {
            margin-bottom: 16px;
            padding: 14px 16px;
            background: #f9fcff;
            border-radius: 24px;
            border: 1px solid #dce4f2;
        }
        .train-id-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            color: #1d2c4a;
            margin-bottom: 8px;
        }
        .train-id-label i {
            color: #2050d0;
        }
        .train-id-input {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #cfdaea;
            border-radius: 32px;
            font-size: 16px;
            background: white;
            transition: 0.2s;
            outline: none;
        }
        .train-id-input:focus {
            border-color: #285fe0;
            box-shadow: 0 0 0 3px rgba(40, 95, 224, 0.1);
        }
        .train-hint {
            font-size: 12px;
            color: #7b8caa;
            margin-top: 5px;
            margin-left: 5px;
        }
        .category-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }
        .cat-item {
            background: #f1f4fb;
            border-radius: 50px;
            padding: 8px 15px;
            font-size: 12.5px;
            font-weight: 500;
            color: #31405a;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: 0.1s;
        }
        .cat-item.active {
            background: #e1eaff;
            border-color: #2861f0;
            color: #1643b6;
            font-weight: 600;
        }
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 6px;
        }
        .inspect-item {
            background: #f9fbfe;
            border-radius: 22px;
            padding: 16px 14px 14px;
            border: 1px solid #dfe5ef;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }
        .item-name {
            font-weight: 500;
            color: #1c2938;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .choice-btns {
            display: flex;
            gap: 8px;
        }
        .choice-btn {
            padding: 5px 15px;
            background: white;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            border: 1.5px solid #d4dceb;
            color: #3d4d66;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.08s;
        }
        .choice-btn.ok-active {
            background: #e1f6e9;
            border-color: #2a9d5c;
            color: #116b35;
            font-weight: 600;
        }
        .choice-btn.fail-active {
            background: #ffebea;
            border-color: #e35d52;
            color: #b02b21;
            font-weight: 600;
        }
        .remark-box {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease, margin 0.25s;
        }
        .remark-box.show {
            max-height: 180px;
            margin-top: 10px;
        }
        .remark-box textarea {
            width: 100%;
            height: 100px;
            padding: 12px 14px;
            border: 1px solid #fdd6d3;
            background: #fff8f7;
            border-radius: 18px;
            font-size: 14px;
            resize: vertical;
            outline: none;
            font-family: inherit;
            box-sizing: border-box;
            line-height: 1.4;
        }
        .char-counter {
            font-size: 12px;
            color: #8b9bb5;
            text-align: right;
            margin-top: 4px;
        }
        .signature-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }
        .signature-panel {
            background: #fafbff;
            border-radius: 24px;
            padding: 16px;
            border: 1px solid #e0e7f2;
        }
        .sig-title {
            font-weight: 600;
            color: #1d2a43;
            font-size: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }
        .canvas-box {
            background: white;
            border-radius: 18px;
            border: 1.5px dashed #a8bad9;
            height: 120px;
            width: 100%;
            touch-action: none;
            overflow: hidden;
        }
        .canvas-box canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
            background: white;
        }
        .sign-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #6a7d9c;
            font-size: 13px;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            gap: 3px;
            align-items: center;
        }
        .sig-status {
            font-size: 13px;
            color: #607089;
        }
        .sig-status.done {
            color: #107c3f;
            font-weight: 500;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .btn-primary, .btn-secondary {
            flex: 1;
            padding: 15px 0;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.1s;
            min-width: 140px;
        }
        .btn-primary {
            background: #285fe0;
            color: white;
        }
        .btn-primary:active {
            background: #1747b8;
            transform: scale(0.98);
        }
        .btn-secondary {
            background: white;
            border: 1px solid #d2dae8;
            color: #33435b;
        }
        .btn-secondary:active {
            background: #eef2f8;
        }
        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(23, 28, 35, 0.9);
            backdrop-filter: blur(5px);
            color: white;
            padding: 12px 22px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 99;
            display: flex;
            gap: 7px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            max-width: 90%;
            text-align: center;
            line-height: 1.4;
        }
        .toast.show {
            opacity: 1;
        }
        @media (max-width: 600px) {
            .cat-item {
                font-size: 11px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>

<div class="page" id="pageContainer">
    <!-- 顶部 -->
    <div class="nav-header">
        <h1><i class="fas fa-train-subway"></i> 轨道车养护</h1>
        <span class="date-badge" id="dateText"></span>
    </div>

    <!-- 车号 -->
    <div class="card" style="padding-top: 12px; padding-bottom: 12px;">
        <div class="train-id-area" style="margin-bottom: 0; border: none; padding: 0 0 6px;">
            <label class="train-id-label"><i class="fas fa-train"></i> 请输入车号</label>
            <input type="text" class="train-id-input" id="trainNumber" placeholder="例如: GCD-1000 14027" maxlength="30">
            <div class="train-hint"><i class="fas fa-circle-info"></i> 车号格式示例：GCD-1000 14027</div>
        </div>
    </div>

    <!-- 十一大类切换 -->
    <div class="card">
        <div class="card-title"><i class="fas fa-layer-group"></i> 十一类保养模板</div>
        <div class="category-grid" id="categoryContainer"></div>
    </div>

    <!-- 动态项目 -->
    <div class="card">
        <div class="card-title" id="categoryTitle"><i class="fas fa-clipboard-list"></i> 保养项目</div>
        <div id="itemsContainer"></div>
    </div>

    <!-- 签字区 -->
    <div class="card">
        <div class="card-title"><i class="fas fa-pen-to-square"></i> 在线签字</div>
        <div class="signature-area">
            <div class="signature-panel">
                <div class="sig-title"><i class="fas fa-user-astronaut"></i> 保养人签字</div>
                <div class="canvas-box">
                    <canvas id="sigCanvas1" width="560" height="120"></canvas>
                </div>
                <div class="sign-actions">
                    <button class="clear-btn" id="clearSign1"><i class="fas fa-eraser"></i> 清除</button>
                    <span class="sig-status" id="sigStatus1">未签字</span>
                </div>
            </div>
            <div class="signature-panel">
                <div class="sig-title"><i class="fas fa-user-tie"></i> 工区负责人</div>
                <div class="canvas-box">
                    <canvas id="sigCanvas2" width="560" height="120"></canvas>
                </div>
                <div class="sign-actions">
                    <button class="clear-btn" id="clearSign2"><i class="fas fa-eraser"></i> 清除</button>
                    <span class="sig-status" id="sigStatus2">未签字</span>
                </div>
            </div>
            <div class="signature-panel">
                <div class="sig-title"><i class="fas fa-user-gear"></i> 车间负责人</div>
                <div class="canvas-box">
                    <canvas id="sigCanvas3" width="560" height="120"></canvas>
                </div>
                <div class="sign-actions">
                    <button class="clear-btn" id="clearSign3"><i class="fas fa-eraser"></i> 清除</button>
                    <span class="sig-status" id="sigStatus3">未签字</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-buttons">
        <button class="btn-secondary" id="resetBtn"><i class="fas fa-rotate-left"></i> 重置</button>
        <button class="btn-primary" id="saveBtn"><i class="fas fa-download"></i> 保存截图</button>
        <button class="btn-secondary" id="copyBtn" style="flex:1; min-width:120px;"><i class="fas fa-copy"></i> 复制数据</button>
    </div>
</div>

<div class="toast" id="toastBox"><i class="fas fa-check-circle" style="color:#8fe3a0;"></i><span id="toastMsg">提示</span></div>

<script>
    (function() {
        // ========== 十一大类定义（内容可自行编辑） ==========
        const CATEGORY_ITEMS = {
            'daily': { title: '轨道作业车日常保养', icon: 'fa-gear', items: ['检查发动机机油油位、冷却液水位是否符合标准。','散热风扇皮带盘无松动、润滑良好，风扇皮带无裂纹张紧度适中，张紧轮无异常。','发动机外观无漏油、漏水、漏气现象；发动机各部螺栓紧固，附件齐全。','发动机各传感器、报警器接线良好，接线盒安装牢固。','油门装置各销轴、开口销完好，各水管安装牢固，卡箍紧固无松动。','消音器吊带无裂纹、螺栓紧固，隔热层安装牢固，作用良好。','检查发电机、起动电动机，确保工作正常，性能可靠。','发动机下部各螺栓牢固可靠，无漏油、漏水情况。','空压机底座螺栓无松动，油位符合要求，支架、张紧轮牢固，黄油嘴齐全润滑良好，皮带无裂纹、无划伤、扰度一致（皮带中间手指能压10-15mm）。各护罩无松动，螺栓无遗失，安装牢固可靠。散热器安装牢固，各水管、开关无滴漏。','检查列车无线调度通信设备、列车运行监控装置和机车信号性能良好。轴温监控装置、作业视频安全监控装置和行车记录仪工作正常。','检查灯光、仪表、电气柜、电气设备各部安装牢固，作用良好。电气系统各线束无虚接、松脱，无破损、老化。','排障器螺栓安装紧固，机车信号传感器及托架安装牢固无松动，高度符合要求。','折角塞门及制动管安装牢固，角度正确、无泄漏，制动软管无裂纹、接口垫完好，水压实验不超期。','左右基础制动装置悬挂装置无裂纹无开焊，上、中、下穿销、开口销齐全良好。','制动拉杆各穿销、开口销齐全； 防侧磨拉杆、牵引杆螺栓紧固润滑良好油嘴开口销齐全。','制动缸安装牢固可靠，复位弹簧作用良好。','各风缸固定无松动，螺栓牢固可靠，塞门作用良好。','检查和调整制动缸活塞行程、闸瓦间隙，更换磨损超限闸瓦。检查手制动装置是否有效。','及时清除和排放各风缸、制动管路中的积水和油污。','检查蓄电池极柱连接情况，接线无松脱，电解液高度符合要求。','车轴弛缓线无错位、显示清楚，托框牢固可靠。','传动轴连接螺栓无松动，润滑正常。 固定轴螺栓齐全紧固，润滑良好。','分动箱或变矩器箱体固定螺栓牢固可靠，油位符合规定要。','车轴齿轮箱各油封正常，无漏油，油位符合规定，紧固各固定螺栓。','车钩三态（闭锁、开锁、全开状态）作用良好，摆动灵活。','钩舌销和钩尾销安全螺栓的开口销齐全，作用正常。','检查生活发电机安装吊架各螺栓紧固可靠，无漏油漏水现象。各部件齐全，柜门锁闭完好、可靠。','检查生活发电机机油油位、冷水冷却水位是否正常，有无漏油、漏水现象。','空调外机托架安装牢固可靠无缺失。','检查牵引变流器柜外观良好，柜体焊缝无裂纹，外观无污物、穿孔现象，各螺栓紧固牢固。','检查牵引变流器进风口过滤网有无杂物堵塞，及时对过滤网杂物进行清理。','检查牵引电机机体无裂纹，接线盒完好、固定可靠，无渗漏油情况。各传感器安装稳固，传感器线无断裂破损现象。','检查制动电阻外观良好，螺栓螺母紧固牢固。接线牢固可靠，线缆外观无破损。','检查动力电池表面无变形、破损等缺陷。','路用平车钩、钩销、风管、塞门作用良好。','路用平车减震装置、联接螺栓、基础制动装置作用良好，制动缸及行程符合要求，闸瓦磨损无超限。','路用平车端板、挡板安装牢固。','驾驶室内清洁整理。','清洁车身内外、车窗、仪表盘、电气柜、电气设备和各部件。','起动发动机检查发动机的启动和运转是否平稳、有无异常声响和震动。','起动发动机正常后，检查各仪表读数是否正常。','进行制动机实验，观察制动、缓解情况。检查制动缸活塞行程、闸瓦间隙，更换磨损超限闸瓦。检查手制动装置是否有效。'] },
            '1350_daily': { title: '1350轨道作业车日常保养', icon: 'fa-truck-fast', items: ['1350空压机油位','转向架连接检查','车钩润滑','电气控制柜'] },
            'weekly': { title: '轨道作业车周保养', icon: 'fa-calendar-week', items: ['蓄电池电压','冷却液液位','传动轴螺栓','车轮磨损检查'] },
            '1350_weekly': { title: '1350轨道作业车周保养', icon: 'fa-calendar-alt', items: ['1350制动缸行程','走行部紧固','空滤清洁','润滑点注油'] },
            'periodic': { title: '轨道作业定期保养', icon: 'fa-clock', items: ['液压系统压力','制动闸瓦间隙','车体绝缘检测','紧固件复紧'] },
            '1350_periodic': { title: '1350轨道作业定期保养', icon: 'fa-clock-cog', items: ['牵引电机检查','空压机皮带','控制柜清洁','轴箱润滑'] },
            'vehicle_transfer': { title: '挂运转场保养', icon: 'fa-truck', items: ['挂车连接器','制动软管','转向架锁定','信号灯检查'] },
            'self_transfer': { title: '自运行转场保养', icon: 'fa-road', items: ['驾驶控制测试','走行部检查','限速装置','喇叭检查'] },
            'special': { title: '专项保养', icon: 'fa-bullhorn', items: ['专项防脱落检查','探伤检测','温升检测','专项清洁'] },
            'reserve1': { title: '备用保养1', icon: 'fa-box', items: ['备用项A','备用项B','备用项C','备用项D'] },
            'reserve2': { title: '备用保养2', icon: 'fa-box-open', items: ['预留保养X','预留保养Y','预留保养Z','预留W'] }
        };

        let currentCategory = 'daily';
        let itemRefs = [];

        // ========== 渲染分类标签 ==========
        const categoryContainer = document.getElementById('categoryContainer');
        Object.keys(CATEGORY_ITEMS).forEach((key) => {
            const cat = CATEGORY_ITEMS[key];
            const div = document.createElement('div');
            div.className = 'cat-item' + (key === 'daily' ? ' active' : '');
            div.setAttribute('data-key', key);
            div.innerHTML = `<i class="fas ${cat.icon}"></i> ${cat.title}`;
            div.addEventListener('click', function() {
                document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                currentCategory = key;
                renderItems(key);
            });
            categoryContainer.appendChild(div);
        });

        // ========== 渲染保养项目 ==========
        function renderItems(categoryKey) {
            const container = document.getElementById('itemsContainer');
            const titleEl = document.getElementById('categoryTitle');
            const catData = CATEGORY_ITEMS[categoryKey];
            titleEl.innerHTML = `<i class="fas ${catData.icon}"></i> ${catData.title} · 项目`;

            container.innerHTML = '';
            itemRefs = [];

            catData.items.forEach((itemName, idx) => {
                const itemId = `${categoryKey}_${idx}`;
                const wrapper = document.createElement('div');
                wrapper.className = 'inspect-item';
                wrapper.innerHTML = `
                    <div class="item-header">
                        <span class="item-name"><i class="fas fa-check-circle" style="color:#5a77a8; font-size:14px;"></i> ${itemName}</span>
                        <div class="choice-btns">
                            <button class="choice-btn ok-btn"><i class="fas fa-circle-check"></i> 对</button>
                            <button class="choice-btn fail-btn"><i class="fas fa-circle-xmark"></i> 错</button>
                        </div>
                    </div>
                    <div class="remark-box" id="remark_${itemId}">
                        <textarea id="remarkInput_${itemId}" maxlength="150" placeholder="请输入问题详情，最多150字"></textarea>
                        <div class="char-counter"><span id="count_${itemId}">0</span>/150</div>
                    </div>
                `;
                container.appendChild(wrapper);

                const okBtn = wrapper.querySelector('.ok-btn');
                const failBtn = wrapper.querySelector('.fail-btn');
                const remarkBox = wrapper.querySelector('.remark-box');
                const textarea = wrapper.querySelector('textarea');
                const counterSpan = wrapper.querySelector('.char-counter span');

                okBtn.classList.add('ok-active');
                wrapper.dataset.answer = 'ok';

                textarea.addEventListener('input', function() {
                    counterSpan.innerText = textarea.value.length;
                });

                okBtn.addEventListener('click', () => {
                    okBtn.classList.add('ok-active');
                    failBtn.classList.remove('fail-active');
                    remarkBox.classList.remove('show');
                    textarea.value = '';
                    counterSpan.innerText = '0';
                    wrapper.dataset.answer = 'ok';
                });

                failBtn.addEventListener('click', () => {
                    failBtn.classList.add('fail-active');
                    okBtn.classList.remove('ok-active');
                    remarkBox.classList.add('show');
                    wrapper.dataset.answer = 'fail';
                });

                itemRefs.push({
                    id: itemId,
                    name: itemName,
                    okBtn, failBtn, remarkBox, textarea
                });
            });
        }

        renderItems('daily');

        // ========== 签字板逻辑 ==========
        const canvasSigns = {
            c1: { canvas: document.getElementById('sigCanvas1'), ctx: document.getElementById('sigCanvas1').getContext('2d'), has: false, drawing: false, statusId: 'sigStatus1' },
            c2: { canvas: document.getElementById('sigCanvas2'), ctx: document.getElementById('sigCanvas2').getContext('2d'), has: false, drawing: false, statusId: 'sigStatus2' },
            c3: { canvas: document.getElementById('sigCanvas3'), ctx: document.getElementById('sigCanvas3').getContext('2d'), has: false, drawing: false, statusId: 'sigStatus3' }
        };

        Object.values(canvasSigns).forEach(sig => {
            sig.ctx.fillStyle = '#fff';
            sig.ctx.fillRect(0, 0, sig.canvas.width, sig.canvas.height);
        });

        function getPos(canvas, e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function bindCanvas(key) {
            const sig = canvasSigns[key];
            const canvas = sig.canvas, ctx = sig.ctx;
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', moveDraw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveDraw(e); }, { passive: false });
            canvas.addEventListener('touchend', endDraw);

            function startDraw(e) {
                const pos = getPos(canvas, e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#1d293b';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                sig.has = true;
                sig.drawing = true;
                updateStatus(key);
            }
            function moveDraw(e) {
                if (!sig.drawing) return;
                const pos = getPos(canvas, e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }
            function endDraw() {
                sig.drawing = false;
            }
        }

        function updateStatus(key) {
            const sig = canvasSigns[key];
            const statusEl = document.getElementById(sig.statusId);
            if (sig.has) {
                statusEl.innerHTML = `<i class="fas fa-check" style="color:#1f9d55;"></i> 已签字`;
                statusEl.classList.add('done');
            } else {
                statusEl.innerHTML = '未签字';
                statusEl.classList.remove('done');
            }
        }

        ['c1', 'c2', 'c3'].forEach(key => bindCanvas(key));

        document.getElementById('clearSign1').addEventListener('click', () => clearSig('c1'));
        document.getElementById('clearSign2').addEventListener('click', () => clearSig('c2'));
        document.getElementById('clearSign3').addEventListener('click', () => clearSig('c3'));

        function clearSig(key) {
            const sig = canvasSigns[key];
            sig.ctx.fillStyle = '#fff';
            sig.ctx.fillRect(0, 0, sig.canvas.width, sig.canvas.height);
            sig.has = false;
            updateStatus(key);
        }

        // ========== 辅助函数 ==========
        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMsg').innerHTML = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function getFileName() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}${month}${day}保养.png`;
        }

        // ========== 保存截图（增强版：支持多种方式） ==========
        document.getElementById('saveBtn').addEventListener('click', function() {
            const trainNum = document.getElementById('trainNumber').value.trim();
            if (!trainNum) {
                showToast('请填写车号');
                return;
            }

            // 存储数据到 localStorage
            const itemsData = itemRefs.map(ref => {
                const status = ref.okBtn.classList.contains('ok-active') ? 'ok' : 'fail';
                const remark = ref.textarea.value.trim();
                return { item: ref.name, status: status, remark: status === 'fail' ? remark : '' };
            });
            const sign1 = canvasSigns.c1.has ? canvasSigns.c1.canvas.toDataURL('image/png') : null;
            const sign2 = canvasSigns.c2.has ? canvasSigns.c2.canvas.toDataURL('image/png') : null;
            const sign3 = canvasSigns.c3.has ? canvasSigns.c3.canvas.toDataURL('image/png') : null;
            const report = {
                trainId: trainNum,
                category: currentCategory,
                categoryName: CATEGORY_ITEMS[currentCategory].title,
                date: new Date().toISOString(),
                items: itemsData,
                signatures: { operator: sign1, supervisor: sign2, workshop: sign3 }
            };
            localStorage.setItem('track_last_report', JSON.stringify(report));

            const fileName = getFileName();

            // 使用html2canvas生成截图
            const pageElement = document.getElementById('pageContainer');
            
            // 显示加载提示
            showToast('正在生成截图...');
            
            html2canvas(pageElement, {
                scale: 2,
                backgroundColor: '#f4f6fb',
                useCORS: true,
                logging: false
            }).then(canvasImg => {
                const imgData = canvasImg.toDataURL('image/png');
                
                // 尝试多种方式下载
                try {
                    // 方法1: 标准下载 (适用于大多数桌面浏览器)
                    const link = document.createElement('a');
                    link.download = fileName;
                    link.href = imgData;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    // 方法2: 如果在微信/移动端，尝试打开新窗口
                    if (navigator.userAgent.toLowerCase().includes('micromessenger') || 
                        navigator.userAgent.toLowerCase().includes('wechat')) {
                        const newTab = window.open('about:blank', '_blank');
                        if (newTab) {
                            newTab.document.write(`<img src="${imgData}" style="width:100%; max-width:600px; margin:10px auto; display:block; border:1px solid #ccc;">`);
                            newTab.document.title = fileName;
                        }
                    }
                    
                    // 方法3: 生成一个隐藏的下载区域，方便手动保存
                    const downloadArea = document.createElement('div');
                    downloadArea.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:white;border:2px solid #285fe0;border-radius:12px;padding:15px;box-shadow:0 8px 30px rgba(0,0,0,0.2);max-width:90%;';
                    downloadArea.innerHTML = `
                        <p style="font-weight:600;margin-bottom:8px;color:#1a2a4a;font-size:14px;">
                            <i class="fas fa-download" style="color:#285fe0;"></i> 若未自动保存，请长按/右键图片保存
                        </p>
                        <img src="${imgData}" style="max-width:100%; max-height:300px; border-radius:8px; cursor:pointer;">
                        <p style="margin-top:8px;color:#666;font-size:12px;">文件名：${fileName}</p>
                        <button id="manualSaveBtn" class="manual-save-btn" style="margin-top:10px;width:100%;padding:10px;background:#285fe0;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600;">立即保存 (手动下载)</button>
                    `;
                    document.body.appendChild(downloadArea);
                    
                    // 手动保存按钮点击弹窗
                    const manualBtn = document.getElementById('manualSaveBtn');
                    if (manualBtn) {
                        manualBtn.addEventListener('click', function() {
                            window.open(imgData, '_blank');
                        });
                    }
                    
                    // 显示成功提示
                    showToast('✅ 已保存：' + fileName + ' 请查看下载区');
                    
                    // 5秒后自动移除下载区域
                    setTimeout(() => {
                        if (downloadArea.parentNode) {
                            downloadArea.parentNode.removeChild(downloadArea);
                        }
                    }, 15000);
                    
                } catch (e) {
                    console.error('保存失败', e);
                    // 最后尝试打开图片新窗口
                    window.open(imgData, '_blank');
                    showToast('请在新窗口长按图片保存为：' + fileName);
                }
            }).catch((err) => {
                console.error('截图生成失败', err);
                showToast('❌ 未保存成功，请重试');
            });
        });

        // ========== 复制数据功能 ==========
        document.getElementById('copyBtn').addEventListener('click', function() {
            const trainNum = document.getElementById('trainNumber').value.trim();
            if (!trainNum) {
                showToast('请填写车号');
                return;
            }
            
            const itemsData = itemRefs.map(ref => {
                const status = ref.okBtn.classList.contains('ok-active') ? '对' : '错';
                const remark = ref.textarea.value.trim();
                return `${ref.name}: ${status}${status === '错' && remark ? ' - ' + remark : ''}`;
            });
            
            const now = new Date();
            const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
            
            const reportText = `轨道作业车保养记录 (${dateStr})\n车号: ${trainNum}\n类别: ${CATEGORY_ITEMS[currentCategory].title}\n${itemsData.join('\n')}`;
            
            // 复制到剪贴板
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(reportText).then(() => {
                    showToast('✅ 数据已复制到剪贴板');
                }).catch(() => {
                    // 降级方案
                    const textarea = document.createElement('textarea');
                    textarea.value = reportText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('✅ 数据已复制');
                });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = reportText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ 数据已复制');
            }
        });

        // 重置
        function resetAll() {
            itemRefs.forEach(ref => {
                ref.okBtn.classList.add('ok-active');
                ref.failBtn.classList.remove('fail-active');
                ref.remarkBox.classList.remove('show');
                ref.textarea.value = '';
                const counter = document.getElementById(`count_${ref.id}`);
                if (counter) counter.innerText = '0';
            });
            ['c1', 'c2', 'c3'].forEach(key => clearSig(key));
            document.getElementById('trainNumber').value = '';
            showToast('表单已重置');
        }

        document.getElementById('resetBtn').addEventListener('click', resetAll);

        // 日期显示
        const now = new Date();
        document.getElementById('dateText').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
    })();
</script>
</body>
